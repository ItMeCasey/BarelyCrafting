# Barely Crafting settings. Edit a value and restart the game or server. Delete a line to restore its default.
# The server enforces the button and neighbor settings; a client hides the buttons its own file turns off.

# Look of the screens: minecraft (gray, like the game) or modern (dark with gold, like Show Me What This Is). Client side.
ui.theme=modern

# Show the Clear button (grid items go to neighboring storage first, then your inventory).
buttons.clear=true

# Show the Rotate button (turns the grid contents a quarter turn clockwise).
buttons.rotate=false

# Show the Mirror button (flips the grid contents left to right).
buttons.mirror=true

# Show the Balance button (spreads equal items evenly over their grid slots).
buttons.balance=true

# Show the Refill button (tops up every filled grid slot to a full stack from your inventory, then neighbors).
buttons.refill=true

# Show the Craft All button (crafts as many as possible into your inventory, like Shift-clicking the result).
buttons.craft_all=false

# Let the station use items from storages next to it.
neighbors.enabled=false

# Which sides are scanned, in this order. The first storage that has an item is used first.
neighbors.faces=east,north

# Most neighboring storages scanned (1 to 6).
neighbors.max=3

# Most crafts one Shift-click or Craft All performs (a safety limit).
craft.max_per_click=100
